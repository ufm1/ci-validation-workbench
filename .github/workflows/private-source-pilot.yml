name: Private source verification (pilot)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-source-branch-validation
  # A fresh owner-triggered validation supersedes a stale or stalled run.
  cancel-in-progress: true

jobs:
  validation:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 1 &&
        github.event.comment.user.login == 'ufm1' &&
        github.event.comment.body == '/run-private-validation'))
    name: Source validation
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Checkout public runner control files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: runner-control
          persist-credentials: false
          fetch-depth: 1

      - name: Create short-lived read-only private checkout token
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PRIVATE_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_REPO_APP_PRIVATE_KEY }}
          owner: ${{ vars.PRIVATE_REPO_OWNER }}
          repositories: ${{ vars.PRIVATE_REPO_NAME }}
          permission-contents: read

      - name: Resolve trusted private branch head
        id: resolve
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ steps.private-token.outputs.token }}
          PRIVATE_REPO_OWNER: ${{ vars.PRIVATE_REPO_OWNER }}
          PRIVATE_REPO_NAME: ${{ vars.PRIVATE_REPO_NAME }}
          SOURCE_REF: feature/stm32f1-keypad-bsp
        run: |
          set -euo pipefail
          [[ "${PRIVATE_REPO_OWNER}" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "${PRIVATE_REPO_NAME}" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "${SOURCE_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]
          encoded_ref="${SOURCE_REF//\//%2F}"
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PRIVATE_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_REPO_OWNER}/${PRIVATE_REPO_NAME}/commits/${encoded_ref}")"
          source_sha="$(jq -r '.sha // empty' <<<"${response}")"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the configured private source revision."
            exit 2
          }
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ vars.PRIVATE_REPO_OWNER }}/${{ vars.PRIVATE_REPO_NAME }}
          ref: ${{ steps.resolve.outputs.source_sha }}
          token: ${{ steps.private-token.outputs.token }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          clean: true

      - name: Verify source and run private validation
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C private-src rev-parse HEAD)"
          [[ "${actual_sha,,}" == "${SOURCE_SHA,,}" ]] || {
            echo "::error::Checked-out commit does not match resolved source revision."
            exit 3
          }
          test -f private-src/ci/run_public_runner_pilot.sh || {
            echo "::error::Validation entry point is missing from the checked-out revision."
            exit 4
          }
          echo "Source revision verified."
          echo "Compiler: $(gcc --version | head -n 1)"
          bash private-src/ci/run_public_runner_pilot.sh

      # The private source has finished executing before the write-capable
      # public-repository token is introduced in the separate job below.

  record_attempt:
    if: ${{ always() && needs.validation.outputs.source_sha != '' }}
    name: Record attempted source revision
    needs: validation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: runner-control
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 1

      - name: Record source revision and validation outcome
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validation.outputs.source_sha }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          set -euo pipefail
          cd runner-control
          if git fetch --quiet origin refs/heads/ci-state; then
            git checkout -B ci-state FETCH_HEAD
          else
            git checkout --orphan ci-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p .ci-state
          printf '%s\n' "${SOURCE_SHA}" > .ci-state/private-source-last-attempted-sha.txt
          printf '%s\n' "${VALIDATION_RESULT}" > .ci-state/private-source-last-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-state/private-source-last-attempted-sha.txt .ci-state/private-source-last-result.txt
          if git diff --cached --quiet; then
            echo "Validation state is already current."
          else
            git commit -m "Record private source validation result"
            git push origin HEAD:refs/heads/ci-state
          fi
